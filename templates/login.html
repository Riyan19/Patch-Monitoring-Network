<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Patch Monitor Network</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>

<body class="bg-gray-900 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-md bg-gray-800 rounded-xl shadow-2xl overflow-hidden border border-gray-700">
        <div class="bg-gray-700/50 p-6 text-center border-b border-gray-700">
            <h1 class="text-2xl font-bold text-white tracking-wide">
                <i class="fa-solid fa-shield-halved text-blue-500 mr-2"></i> Patch Monitor
            </h1>
            <p class="text-gray-400 text-sm mt-1">Secure Login</p>
        </div>

        <div class="p-8">
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            <div class="mb-6 space-y-2">
                {% for category, message in messages %}
                <div class="p-3 rounded text-sm text-center
                            {% if category == 'error' %} bg-red-900/50 text-red-200 border border-red-800
                            {% else %} bg-blue-900/50 text-blue-200 border border-blue-800 {% endif %}">
                    {{ message }}
                </div>
                {% endfor %}
            </div>
            {% endif %}
            {% endwith %}

            <form action="/login" method="POST" class="space-y-6">
                <div>
                    <label class="block text-gray-400 text-sm font-bold mb-2">Username</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-500"><i class="fa-solid fa-user"></i></span>
                        <input type="text" name="username" required autofocus
                            class="w-full bg-gray-900/50 border border-gray-600 rounded-lg py-2.5 pl-10 pr-4 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    </div>
                </div>

                <div>
                    <label class="block text-gray-400 text-sm font-bold mb-2">Password</label>
                    <div class="relative">
                        <span class="absolute left-3 top-3 text-gray-500"><i class="fa-solid fa-lock"></i></span>
                        <input type="password" name="password" required
                            class="w-full bg-gray-900/50 border border-gray-600 rounded-lg py-2.5 pl-10 pr-4 text-white placeholder-gray-500 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition">
                    </div>
                </div>

                <button type="submit"
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition duration-200 transform hover:scale-[1.02] shadow-lg">
                    Sign In
                </button>
            </form>
        </div>

        <div class="bg-gray-900/50 p-4 text-center text-xs text-gray-500 border-t border-gray-700">
            Internal Monitoring System
        </div>
    </div>

</body>

</html>
